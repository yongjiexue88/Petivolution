# Cloud Build configuration for Petivolution Backend
# This file is used by Google Cloud Build for CI/CD deployment

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/petivolution-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/petivolution-backend:latest'
      - '.'
    dir: 'backend'

  # Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/petivolution-backend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/petivolution-backend:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'petivolution-backend'
      - '--image=gcr.io/$PROJECT_ID/petivolution-backend:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--max-instances=1'              # CRITICAL: Single instance to prevent world forking
      - '--min-instances=0'              # Scale to zero when not in use (optional, can set to 1 for always-on)
      - '--memory=512Mi'                 # Adjust based on world size needs
      - '--cpu=1'                        # Single CPU sufficient for 30Hz tick rate
      - '--timeout=300'                  # 5 minute timeout (max 3600s/60min)
      - '--port=3000'                    # Express server port
      - '--allow-unauthenticated'        # Allow public access (change if auth needed)
      - '--set-env-vars=NODE_ENV=production'

# Substitution variables (can be overridden)
substitutions:
  _REGION: 'us-central1'  # Change this to your preferred region

# Images to be pushed to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/petivolution-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/petivolution-backend:latest'

# Build timeout
timeout: '1200s'  # 20 minutes

# Options
options:
  machineType: 'N1_HIGHCPU_8'  # Use a faster machine for builds
  logging: CLOUD_LOGGING_ONLY
