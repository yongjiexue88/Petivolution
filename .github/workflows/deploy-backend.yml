name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main  # Triggers on every push to main branch
  workflow_dispatch:  # Allow manual triggering from GitHub UI

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  SERVICE_NAME: petivolution-backend
  REGISTRY: gcr.io

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    
    # Optional: Add environment protection rules
    # environment:
    #   name: production
    #   url: ${{ steps.deploy.outputs.url }}
    
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Authentication Option 1: Workload Identity Federation (Recommended - More Secure)
      # Uncomment this block and comment out the service account key method below
      # - name: Authenticate to Google Cloud (Workload Identity)
      #   uses: google-github-actions/auth@v2
      #   with:
      #     workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
      #     service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      
      # Authentication Option 2: Service Account Key (Simpler Setup)
      # Comment this out if using Workload Identity Federation above
      - name: Authenticate to Google Cloud (Service Account Key)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker
      
      - name: Build Docker image
        working-directory: ./backend
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest \
            .
      
      - name: Push Docker image to GCR
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest
      
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --max-instances=1 \
            --min-instances=0 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=300 \
            --port=3000 \
            --allow-unauthenticated \
            --set-env-vars=NODE_ENV=production,COMMIT_SHA=${{ github.sha }} \
            --set-env-vars=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --set-env-vars=FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }} \
            --set-env-vars=FIREBASE_PRIVATE_KEY="${{ secrets.FIREBASE_PRIVATE_KEY }}" \
            --set-env-vars=GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME || 'petivolution-snapshots' }}
      
      - name: Get Service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "Service deployed to: $SERVICE_URL"
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT
      
      - name: Test Deployment
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          
          echo "Testing health endpoint..."
          curl -f "$SERVICE_URL/health" || exit 1
          
          echo "Testing world summary endpoint..."
          curl -f "$SERVICE_URL/api/world/summary" || exit 1
          
          echo "✅ Deployment verified successfully!"
      
      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const serviceUrl = '${{ steps.deploy.outputs.service_url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Backend deployed to Cloud Run!\n\n**Service URL:** ${serviceUrl}\n\n**Test endpoints:**\n- Health: ${serviceUrl}/health\n- Summary: ${serviceUrl}/api/world/summary`
            });
